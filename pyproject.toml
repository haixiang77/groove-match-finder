[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "refscope"
version = "1.0.0"
description = "RefScope — find reference tracks that share groove, drum grid and sonic texture (Python backend + mobile-friendly web UI)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "librosa>=0.10",
  "soundfile>=0.12",
  "pydantic>=2.6",
  "httpx>=0.27",
  "shazamio>=0.6",
  "pylast>=5.2",
  "musicbrainzngs>=0.7.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "qrcode>=7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
refscope = "refscope.cli:main"

[tool.setuptools.packages.find]
include = ["refscope*"]

[tool.setuptools.package-data]
refscope = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests_py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
